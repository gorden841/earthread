          ctx.beginPath();
          ctx.roundRect(x - size*0.15, y + floatY - size*0.3, size*0.3, size*0.6, 6);
          ctx.fill();

          // 冰晶棱角（头顶）
          ctx.fillStyle = '#d4f0ff';
          ctx.beginPath();
          ctx.moveTo(x - size*0.1, y + floatY - size*0.25);
          ctx.lineTo(x, y + floatY - size*0.45);
          ctx.lineTo(x + size*0.1, y + floatY - size*0.25);
          ctx.fill();

          // 眼睛
          ctx.fillStyle = '#1a3b4b';
          ctx.beginPath();
          ctx.arc(x - size*0.06, y + floatY - size*0.05, size*0.06, 0, Math.PI * 2);
          ctx.arc(x + size*0.06, y + floatY - size*0.05, size*0.06, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(x - size*0.05, y + floatY - size*0.08, size*0.025, 0, Math.PI * 2);
          ctx.arc(x + size*0.07, y + floatY - size*0.08, size*0.025, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        // 受击闪白
        if (mon.hitFlash > 0) {
          ctx.globalAlpha = (mon.hitFlash / 8) * 0.65;
          ctx.fillStyle = '#ffffff';
          if (mon.type === 'sandworm') {
            ctx.beginPath();
            ctx.roundRect(x - size / 2, y - size / 2, size, size, 6);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.42, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1.0;
        }

        // 攻击前摇预警（红色脉冲光环 + 感叹号；新星用更大范围提示）
        if (mon.attackWindup > 0) {
          const windupMax = mon.windupTotal || mon.attackWindupMax || 1;
          const t = 1 - mon.attackWindup / windupMax; // 0→1
          const isNova = mon.attackKind === 'nova';
          const ringR = isNova
            ? CFG.sandworm.novaRadius * (0.5 + t * 0.5) // 新星：提示实际判定半径
            : size * (0.55 + t * 0.25);
          const pulse = 1 + Math.sin(performance.now() * 0.03) * 0.08;
          ctx.strokeStyle = `rgba(255, 70, 70, ${0.5 + t * 0.4})`;
          ctx.lineWidth = isNova ? 3 : 2.5;
          ctx.beginPath();
          ctx.arc(x, y, ringR * pulse, 0, Math.PI * 2);
          ctx.stroke();
          // 头顶感叹号
          ctx.fillStyle = `rgba(255, 80, 80, ${0.75 + t * 0.25})`;
          ctx.font = 'bold 16px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', x, y - size / 2 - 14);
        }

        // 头顶血条
        drawMonsterHpBar(mon);
      });

      // 3. 绘制主角残影（在主角之前绘制，在身后）
      if (hero && hero.afterimages.length > 0) {
        hero.afterimages.forEach(img => {
          drawHeroAfterimage(img);
        });
      }

      // 4. 绘制主角（受击无敌期间快速闪烁）
      if (hero) {
        const blink = hero.invincibleFrames > 0 && Math.floor(hero.invincibleFrames / 4) % 2 === 0;
        if (!blink) drawHero();
      }

      // 5. 绘制粒子
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        if (p.size > 2.5) {
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.color;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
      ctx.globalAlpha = 1.0;

      // 5. 绘制风箭
      drawWindArrows();

      // 5.5 绘制敌方冰刺弹道
      drawEnemyProjectiles();

      // 5.6 绘制天降冰锥（警示圈 + 下落冰锥）
      drawIceSpikes();

      // 6. 战斗 HUD（主角血条 + 受击红屏）
      drawCombatHud();

      // 6.5 蓄力瞄准指示
      drawAimIndicator();

      // 7. 游戏结束遮罩
      if (gameOver) drawGameOverOverlay();

      // 8. 绘制虚拟摇杆
      drawJoystick();
    }

    // 怪物头顶血条
    function drawMonsterHpBar(mon) {
      const barW = Math.max(CFG.hud.monsterBarMinWidth, TILE_SIZE * mon.size * CFG.hud.monsterBarWidthFactor);
      const barH = CFG.hud.monsterBarHeight;
      const bx = mon.x - barW / 2;
      const by = mon.y - TILE_SIZE * mon.size / 2 - 9;
      const ratio = Math.max(0, mon.hp / mon.maxHp);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath();
      ctx.roundRect(bx - 1, by - 1, barW + 2, barH + 2, 3);
      ctx.fill();

      // 血量：高→绿，中→黄，低→红
      let fillColor = '#5fd068';
      if (ratio < CFG.hud.lowHpThreshold) fillColor = '#e0524d';
      else if (ratio < CFG.hud.midHpThreshold) fillColor = '#e0b34d';
      ctx.fillStyle = fillColor;
      if (ratio > 0) {
        ctx.beginPath();
        ctx.roundRect(bx, by, barW * ratio, barH, 2);
        ctx.fill();
      }
    }

    // 绘制敌方冰刺弹道（旋转菱形冰晶）
    function drawEnemyProjectiles() {
      enemyProjectiles.forEach(p => {
        const angle = Math.atan2(p.vy, p.vx);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        ctx.shadowColor = 'rgba(160, 220, 255, 0.9)';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#d4f0ff';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(0, -4);
        ctx.lineTo(-5, 0);
        ctx.lineTo(0, 4);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(1, -2);
        ctx.lineTo(1, 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    // 战斗 HUD：主角生命条 + 受击红屏闪烁
    function drawCombatHud() {
      if (!hero) return;

      // 受击红屏（随 hurtFlash 衰减）
      if (hero.hurtFlash > 0) {
        const a = (hero.hurtFlash / 20) * 0.28;
        ctx.fillStyle = `rgba(220, 40, 40, ${a})`;
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
      }

      // 主角血条（左上角）
      const barW = CFG.hud.heroBarWidth, barH = CFG.hud.heroBarHeight;
      const bx = CFG.hud.heroBarX, by = CFG.hud.heroBarY;
      const ratio = Math.max(0, hero.hp / hero.maxHp);

      ctx.fillStyle = 'rgba(10, 14, 20, 0.7)';
      ctx.beginPath();
      ctx.roundRect(bx - 4, by - 4, barW + 8, barH + 22, 8);
      ctx.fill();

      ctx.fillStyle = '#a4b3cc';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('生命', bx + 2, by + barH + 8);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      ctx.roundRect(bx, by, barW, barH, 5);
      ctx.fill();

      if (ratio > 0) {
        let hpColor = '#5fd068';
        if (ratio < CFG.hud.lowHpThreshold) hpColor = '#e0524d';
        else if (ratio < CFG.hud.midHpThreshold) hpColor = '#e0b34d';
        ctx.fillStyle = hpColor;
        ctx.beginPath();
        ctx.roundRect(bx + 2, by + 2, (barW - 4) * ratio, barH - 4, 4);
        ctx.fill();
      }

      // 数值
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.ceil(hero.hp)} / ${hero.maxHp}`, bx + barW / 2, by + barH / 2 + 1);
    }

    // 游戏结束遮罩
    function drawGameOverOverlay() {
      ctx.fillStyle = 'rgba(8, 10, 16, 0.65)';
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);

      ctx.fillStyle = '#ff8a8a';
      ctx.font = 'bold 44px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('你被击败了', WORLD_W / 2, WORLD_H / 2 - 24);

      ctx.fillStyle = '#d7e0f0';
      ctx.font = '18px system-ui, sans-serif';
      ctx.fillText('点击「重置场景」重新开始', WORLD_W / 2, WORLD_H / 2 + 24);
    }

    // 蓄力瞄准指示：拖动轨迹 + 发射方向预览（长按终点 → 长按起点方向）
    function drawAimIndicator() {
      if (!charge.active || !aim.active || !hero) return;

      const dx = aim.startX - aim.curX;
      const dy = aim.startY - aim.curY;
      const len = Math.hypot(dx, dy);

      ctx.save();

      // 拖动轨迹（起点 → 当前点，虚线）
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(aim.startX, aim.startY);
      ctx.lineTo(aim.curX, aim.curY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 起点 / 当前点标记
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(aim.startX, aim.startY, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(aim.curX, aim.curY, 3, 0, Math.PI * 2);
      ctx.fill();

      // 发射方向预览（从主角出发，蓄满后变亮青色）
      if (len >= CFG.charge.minDragDistance) {
        const ux = dx / len, uy = dy / len;
        const color = charge.ready ? 'rgba(140, 235, 255, 0.95)' : 'rgba(255, 255, 255, 0.65)';
        const L = CFG.charge.aimPreviewLength;
        const ex = hero.x + ux * L, ey = hero.y + uy * L;
        ctx.strokeStyle = color;
        ctx.lineWidth = charge.ready ? 3 : 2;
        ctx.beginPath();
        ctx.moveTo(hero.x + ux * 14, hero.y + uy * 14);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        // 箭头
        const ang = Math.atan2(uy, ux);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(ang) * 9, ey + Math.sin(ang) * 9);
        ctx.lineTo(ex + Math.cos(ang + 2.5) * 8, ey + Math.sin(ang + 2.5) * 8);
        ctx.lineTo(ex + Math.cos(ang - 2.5) * 8, ey + Math.sin(ang - 2.5) * 8);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    // 绘制冲刺残影（半透明蓝白色调，淡出+缩小）
    function drawHeroAfterimage(img) {
      const x = img.x;
      const y = img.y;
      const alphaRatio = img.life / img.maxLife; // 1→0
      const scale = 0.7 + 0.1 * alphaRatio; // 从0.8缩小到0.7（更小）
      const alpha = alphaRatio * 0.4; // 最大不透明度0.4（更淡）

      const size = TILE_SIZE * hero.size * scale;
      const bobOffset = Math.sin(img.walkFrame) * 1;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y + bobOffset);
      ctx.scale(img.facing, 1);

      // 残影发光
      ctx.shadowColor = 'rgba(136, 216, 255, 0.7)';
      ctx.shadowBlur = 8 * alphaRatio;

      // 身体（统一青蓝色调）
      const bodyGrad = ctx.createLinearGradient(0, -size * 0.3, 0, size * 0.2);
      bodyGrad.addColorStop(0, 'rgba(180, 235, 255, 0.8)');
      bodyGrad.addColorStop(1, 'rgba(100, 180, 230, 0.75)');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.2, size * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头（亮白蓝色）
      ctx.fillStyle = 'rgba(220, 245, 255, 0.9)';
      ctx.beginPath();
      ctx.arc(0, -size * 0.3, size * 0.14, 0, Math.PI * 2);
      ctx.fill();

      // 风元素宝石（发光）
      ctx.shadowBlur = 5 * alphaRatio;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath();
      ctx.arc(0, -size * 0.05, size * 0.04, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawHero() {
      const x = hero.x;
      const y = hero.y;
      const size = TILE_SIZE * hero.size;
      const bob = Math.sin(hero.walkFrame) * 1.5; // 行走上下浮动

      ctx.save();
      ctx.translate(x, y + bob);
      if (hero.facing < 0) ctx.scale(-1, 1);

      // 影子
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;

      // 身体（金色披风战士风格）
      // 身体主体
      ctx.fillStyle = '#5a4a7a';  // 深紫色外衣
      ctx.beginPath();
      ctx.roundRect(-size*0.35, -size*0.15, size*0.7, size*0.55, 5);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // 腰带
      ctx.fillStyle = '#e0c878';
      ctx.fillRect(-size*0.35, size*0.18, size*0.7, size*0.08);

      // 头部
      ctx.fillStyle = '#f0d8b0';  // 肤色
      ctx.beginPath();
      ctx.roundRect(-size*0.28, -size*0.45, size*0.56, size*0.38, 6);
      ctx.fill();

      // 头发（金色）
      ctx.fillStyle = '#e0c878';
      ctx.beginPath();
      ctx.roundRect(-size*0.32, -size*0.5, size*0.64, size*0.18, 5);
      ctx.fill();
      // 刘海
      ctx.fillStyle = '#d4b860';
      ctx.beginPath();
      ctx.moveTo(-size*0.28, -size*0.38);
      ctx.lineTo(-size*0.1, -size*0.3);
      ctx.lineTo(size*0.05, -size*0.35);
      ctx.lineTo(size*0.2, -size*0.28);
      ctx.lineTo(size*0.24, -size*0.4);
      ctx.lineTo(-size*0.28, -size*0.45);
      ctx.fill();

      // 眼睛
      ctx.fillStyle = '#2a2040';
      ctx.beginPath();
      ctx.arc(-size*0.1, -size*0.25, 1.8, 0, Math.PI * 2);
      ctx.arc(size*0.1, -size*0.25, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-size*0.08, -size*0.27, 0.7, 0, Math.PI * 2);
      ctx.arc(size*0.12, -size*0.27, 0.7, 0, Math.PI * 2);
      ctx.fill();

      // 披风（飘动）
      const capeSway = Math.sin(hero.walkFrame * 0.7) * 3;
      ctx.fillStyle = '#7a5a9a';
      ctx.beginPath();
      ctx.moveTo(-size*0.35, -size*0.15);
      ctx.lineTo(-size*0.5 - capeSway*0.5, size*0.35);
      ctx.lineTo(-size*0.2, size*0.4);
      ctx.lineTo(-size*0.2, -size*0.1);
      ctx.closePath();
      ctx.fill();

      // 胸口宝石（风元素标志）
      ctx.fillStyle = '#88d8ff';
      ctx.shadowColor = 'rgba(136, 216, 255, 0.8)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(0, -size*0.05);
      ctx.lineTo(size*0.08, size*0.05);
      ctx.lineTo(0, size*0.15);
      ctx.lineTo(-size*0.08, size*0.05);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    function drawJoystick() {
      // 底座
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.arc(joystick.baseX, joystick.baseY, joystick.baseRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 方向指示线
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(joystick.baseX - joystick.baseRadius * 0.6, joystick.baseY);
      ctx.lineTo(joystick.baseX + joystick.baseRadius * 0.6, joystick.baseY);
      ctx.moveTo(joystick.baseX, joystick.baseY - joystick.baseRadius * 0.6);
      ctx.lineTo(joystick.baseX, joystick.baseY + joystick.baseRadius * 0.6);
      ctx.stroke();

      // 摇杆头
      ctx.globalAlpha = joystick.active ? 0.9 : 0.7;
      const grad = ctx.createRadialGradient(
        joystick.knobX - 5, joystick.knobY - 5, 2,
        joystick.knobX, joystick.knobY, joystick.knobRadius
      );
      grad.addColorStop(0, 'rgba(224, 200, 120, 0.9)');
      grad.addColorStop(1, 'rgba(150, 120, 60, 0.9)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(joystick.knobX, joystick.knobY, joystick.knobRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    // ------------------- 虚拟摇杆事件 --------------------
    function getTouchFromEvent(e) {
      // 优先用 changedTouches（触发当前事件的手指），支持多点触控
      if (e.changedTouches && e.changedTouches.length > 0) {
        return e.changedTouches[0];
      }
      if (e.touches && e.touches.length > 0) {
        return e.touches[0];
      }
      return e; // 鼠标/指针事件
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      // 映射到世界逻辑坐标（与显示缩放、渲染分辨率无关）
      const scaleX = WORLD_W / rect.width;
      const scaleY = WORLD_H / rect.height;
      const touch = getTouchFromEvent(e);
      const clientX = touch.clientX;
      const clientY = touch.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY,
      };
    }

    function getPointerId(e) {
      const touch = getTouchFromEvent(e);
      return touch.identifier !== undefined ? touch.identifier : (e.pointerId ?? 0);
    }

    function handleJoystickStart(e) {
      const pos = getCanvasPos(e);
      const dist = Math.hypot(pos.x - joystick.baseX, pos.y - joystick.baseY);
      if (dist < joystick.baseRadius * 1.5) {
        joystick.active = true;
        joystick.pointerId = getPointerId(e);
        handleJoystickMove(e);
        e.preventDefault();
        return;
      }
      // 摇杆区域之外：长按场景开始蓄力瞄准
      handleAimStart(e, pos);
    }

    // 长按场景：开始蓄力瞄准
    function handleAimStart(e, pos) {
      if (gameOver || charge.active || aim.active) return;
      aim.active = true;
      aim.pointerId = getPointerId(e);
      aim.startX = aim.curX = pos.x;
      aim.startY = aim.curY = pos.y;
      startCharge();
    }

    function handleAimMove(e) {
      if (!aim.active) return;
      if (getPointerId(e) !== aim.pointerId) return;
      const pos = getCanvasPos(e);
      aim.curX = pos.x;
      aim.curY = pos.y;
      if (e.cancelable) e.preventDefault();
    }

    // 松开：蓄满则朝「长按终点 → 长按起点」方向发射，未蓄满取消
    function handleAimEnd(e) {
      if (!aim.active) return;
      if (getPointerId(e) !== aim.pointerId) return;
      const dx = aim.startX - aim.curX;
      const dy = aim.startY - aim.curY;
      const len = Math.hypot(dx, dy);
      let dirX = 1, dirY = 0;
      if (len >= CFG.charge.minDragDistance) {
        dirX = dx / len;
        dirY = dy / len;
      } else if (hero) {
        dirX = hero.facing; // 几乎未拖动时朝主角面向发射
        dirY = 0;
      }
      aim.active = false;
      aim.pointerId = null;
      releaseCharge(dirX, dirY);
    }

    function handleJoystickMove(e) {
      handleAimMove(e); // 同步更新蓄力瞄准
      if (!joystick.active) return;
      // 多点触控时，只处理属于摇杆的那根手指
      const pid = getPointerId(e);
      if (pid !== joystick.pointerId) return;
      const pos = getCanvasPos(e);
      let dx = pos.x - joystick.baseX;
      let dy = pos.y - joystick.baseY;
      const dist = Math.hypot(dx, dy);
      const maxDist = joystick.baseRadius - joystick.knobRadius * 0.3;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      joystick.knobX = joystick.baseX + dx;
      joystick.knobY = joystick.baseY + dy;
      joystick.dx = dx / maxDist;
      joystick.dy = dy / maxDist;
      e.preventDefault();
    }

    function handleJoystickEnd(e) {
      handleAimEnd(e); // 松开时结算蓄力发射
      if (!joystick.active) return;
      // 多点触控时，只有摇杆对应的手指抬起才结束
      const pid = getPointerId(e);
      if (pid !== joystick.pointerId) return;
      joystick.active = false;
      joystick.pointerId = null;
      joystick.knobX = joystick.baseX;
      joystick.knobY = joystick.baseY;
      joystick.dx = 0;
      joystick.dy = 0;
    }

    // 工具: Canvas roundRect
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };

    // ------------------- 动画循环（固定逻辑步长，锁定 60fps 逻辑速度） -------------------
    let __frameCount = 0;
    // 高刷屏（120/144Hz，微信内置浏览器常见）下 rAF 每秒触发 120/144 次，
    // 若每帧直接更新，按帧推进的移动/前摇/粒子会成倍加速。
    // 做法：按 rAF 时间戳累积真实流逝时间，每 1000/60ms 跑一步逻辑；渲染仍每帧一次。
    const FRAME_MS = 1000 / CFG.frame.fps;
    let __lastFrameTime = 0;
    let __frameAccumulator = 0;
    function stepUpdate() {
      updateKeyboardInput();
      if (!gameOver) {
        updateCharge();
        updateHero();
        updateMonsters();
        updateWindArrows();
        updateEnemyProjectiles();
        updateIceSpikes();
      }
      updateParticles();
    }
    function gameLoop(now) {
      // 捕获每帧异常：保证动画循环不因单次异常而永久停止（卡死），错误输出到控制台便于定位
      try {
        const t = typeof now === 'number' ? now : performance.now();
        if (!__lastFrameTime) __lastFrameTime = t;
        let delta = t - __lastFrameTime;
        __lastFrameTime = t;
        // 切后台/卡顿后时间差可能很大：钳制上限，避免回来时一次性快进爆发
        if (delta > CFG.frame.maxDeltaMs) delta = CFG.frame.maxDeltaMs;
        __frameAccumulator += delta;
        // 按固定步长补跑逻辑（低帧率时每帧多跑几步追时间），步数封顶防止死亡螺旋
        let steps = 0;
        while (__frameAccumulator >= FRAME_MS && steps < CFG.frame.maxCatchupSteps) {
          stepUpdate();
          __frameAccumulator -= FRAME_MS;
          steps++;
          if (DEBUG_NO_DEATH) __frameCount++;
        }
        // 积压超过一帧的追赶上限：直接丢弃，不把卡顿转嫁成后续加速
        if (__frameAccumulator > FRAME_MS * CFG.frame.maxCatchupSteps) __frameAccumulator = 0;
        draw(); // 渲染跟随屏幕刷新率，逻辑速度恒定
      } catch (err) {
        console.error('[gameLoop 异常]', err && (err.stack || err));
      }
      animationFrame = requestAnimationFrame(gameLoop);
    }

    // 启动
    resizeCanvasDisplay();
    resetScene();
    if (animationFrame) cancelAnimationFrame(animationFrame);
    gameLoop();

    // ------------------- 事件绑定 --------------------
    document.getElementById('btnReset').addEventListener('click', () => {
      resetScene();
    });

    // 注：风箭按钮（btnWindArrow）保留为后续技能切换占位，不绑定蓄力。
    // 蓄力发射改为：长按画布场景任意处拖动瞄准，松开发射（见 handleAimStart/End）。

    // 虚拟摇杆 + 场景蓄力事件（鼠标+触摸）
    canvas.addEventListener('mousedown', handleJoystickStart);
    window.addEventListener('mousemove', handleJoystickMove);
    window.addEventListener('mouseup', handleJoystickEnd);

    canvas.addEventListener('touchstart', handleJoystickStart, { passive: false });
    canvas.addEventListener('touchmove', handleJoystickMove, { passive: false });
    canvas.addEventListener('touchend', handleJoystickEnd);
    canvas.addEventListener('touchcancel', handleJoystickEnd);

    // 键盘控制（WASD / 方向键）作为备选
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // 每帧更新键盘方向到摇杆（如果摇杆未激活）
    function updateKeyboardInput() {
      if (joystick.active) return;
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;
      const mag = Math.hypot(dx, dy);
      if (mag > 0) {
        dx /= mag;
        dy /= mag;
      }
      joystick.dx = dx;
      joystick.dy = dy;
      // 同步摇杆头位置（视觉反馈）
      const maxDist = joystick.baseRadius - joystick.knobRadius * 0.3;
      joystick.knobX = joystick.baseX + dx * maxDist;
      joystick.knobY = joystick.baseY + dy * maxDist;
    }

    // 调试模式：暴露内部状态供自动化验证与守恒审计（正常打开不暴露）
    if (DEBUG_NO_DEATH) {
      window.__ET = {
        get frames() { return __frameCount; },
        get tiles() { return tiles; },
        get state() {
          return {
            gameOver: gameOver,
            hp: hero ? hero.hp : null,
            heroX: hero ? hero.x : null,
            heroY: hero ? hero.y : null,
            monsters: monsters.length,
            particles: particles.length,
            arrows: windArrows.length,
            bolts: enemyProjectiles.length,
            spikes: iceSpikes.length,
          };
        },
      };
    }

    window.addEventListener('beforeunload', () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
    });

  })();
</script>


</body></html>
